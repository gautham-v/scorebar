# scorebar is a workspace so that the parts that are not a menu bar app do not
# have to pretend to be one. `sleeper` is plain data fetching and `core` is
# plain arithmetic: both build and test on any platform, in CI, with no
# display and no AppKit. Only `app` needs a Mac.
[workspace]
resolver = "2"
members = ["crates/sleeper", "crates/core", "crates/app"]

# Every crate in the workspace inherits these, so a version bump is one edit.
[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/gautham-v/scorebar"
rust-version = "1.98"

# Shared deps live here so the crates cannot drift onto different versions of
# the same library. reqwest is pinned to rustls rather than the system TLS
# stack to keep the build free of OpenSSL, and to blocking because the app
# fetches on a background thread rather than an async runtime.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "gzip",
] }

# Cargo only honours a profile at the workspace root; the same block inside a
# member crate is silently ignored. opt-level 2 is what claudebar ships: the
# difference from 3 is invisible for a menu bar app and the build is quicker.
[profile.release]
opt-level = 2
